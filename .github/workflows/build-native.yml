name: Build Frida Gadget rootless tweak

on:
  workflow_dispatch:
  push:
    paths:
      - "GrokSelectionFrida/**"
      - ".github/workflows/build-native.yml"

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download the pinned Frida Gadget
        shell: bash
        run: |
          set -euo pipefail
          curl -L \
            "https://github.com/frida/frida/releases/download/17.16.4/frida-gadget-17.16.4-ios-universal.dylib.xz" \
            -o frida-gadget.dylib.xz
          echo "2cf8d5e119b3898eb6f2b8d45f98696cf08c854bb041d30f0f57712392febdb2  frida-gadget.dylib.xz" \
            | shasum -a 256 -c -

      - name: Build the rootless deb
        shell: bash
        run: |
          set -euo pipefail
          python3 GrokSelectionFrida/build_deb.py \
            --gadget-xz frida-gadget.dylib.xz \
            --output GrokSelectionFrida/output \
            --repo-root .
          ls -lh GrokSelectionFrida/output/*.deb

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: grok-selection-frida-3.0.0
          path: GrokSelectionFrida/output/*.deb
          if-no-files-found: error

      - name: Publish package to the Sileo repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            debs \
            Packages \
            Packages.gz \
            Packages.bz2 \
            Packages.xz \
            Release \
            index.html \
            THIRD_PARTY_NOTICES.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish Grok Selection Detector 3.0.0 Frida"
          git push
