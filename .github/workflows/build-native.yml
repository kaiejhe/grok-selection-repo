name: Build Frida Gadget rootless tweak

on:
  workflow_dispatch:
  push:
    paths:
      - "GrokSelectionFrida/**"
      - ".github/workflows/build-native.yml"

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download the pinned Frida Gadget
        shell: bash
        run: |
          set -euo pipefail
          curl -L \
            "https://github.com/frida/frida/releases/download/17.16.4/frida-gadget-17.16.4-ios-universal.dylib.xz" \
            -o frida-gadget.dylib.xz
          echo "2cf8d5e119b3898eb6f2b8d45f98696cf08c854bb041d30f0f57712392febdb2  frida-gadget.dylib.xz" \
            | shasum -a 256 -c -

      - name: Build the diagnostic loader and sign binaries
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p GrokSelectionFrida/build
          python3 -c \
            "import lzma; open('GrokSelectionFrida/build/GrokSelectionFrida.dylib', 'wb').write(lzma.open('frida-gadget.dylib.xz', 'rb').read())"
          codesign --force --sign - \
            GrokSelectionFrida/build/GrokSelectionFrida.dylib
          codesign --verify --verbose=2 \
            GrokSelectionFrida/build/GrokSelectionFrida.dylib
          xcrun --sdk iphoneos clang++ \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=17.0 \
            -fobjc-arc \
            -Os \
            -dynamiclib \
            GrokSelectionFrida/Loader.mm \
            -framework Foundation \
            -framework UIKit \
            -Wl,-dead_strip \
            -Wl,-install_name,/var/jb/Library/MobileSubstrate/DynamicLibraries/GrokSelectionLoader.dylib \
            -o GrokSelectionFrida/build/GrokSelectionLoader.dylib
          codesign --force --sign - \
            GrokSelectionFrida/build/GrokSelectionLoader.dylib
          codesign --verify --verbose=2 \
            GrokSelectionFrida/build/GrokSelectionLoader.dylib

      - name: Build the rootless deb
        shell: bash
        run: |
          set -euo pipefail
          python3 GrokSelectionFrida/build_deb.py \
            --gadget GrokSelectionFrida/build/GrokSelectionFrida.dylib \
            --loader GrokSelectionFrida/build/GrokSelectionLoader.dylib \
            --output GrokSelectionFrida/output \
            --repo-root .
          ls -lh GrokSelectionFrida/output/*.deb

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: grok-selection-frida-3.0.2
          path: GrokSelectionFrida/output/*.deb
          if-no-files-found: error

      - name: Publish package to the Sileo repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            debs \
            Packages \
            Packages.gz \
            Packages.bz2 \
            Packages.xz \
            Release \
            index.html \
            THIRD_PARTY_NOTICES.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish Grok Selection Detector 3.0.2 diagnostics"
          git push
